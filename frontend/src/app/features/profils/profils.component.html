<div class="page-content">
  <div class="page-header">
    <h1><mat-icon>badge</mat-icon> Gestion des Profils</h1>
    <button mat-raised-button color="primary" (click)="openForm()" *ngIf="!isReadOnly">
      <mat-icon>add</mat-icon> Nouveau Profil
    </button>
    <span *ngIf="isReadOnly" style="font-size:.85rem;color:var(--text-secondary);display:flex;align-items:center;gap:6px;">
      <mat-icon style="font-size:16px;height:16px;width:16px;">visibility</mat-icon> Consultation uniquement
    </span>
  </div>

  <mat-card *ngIf="showForm && !isReadOnly" class="form-card">
    <mat-card-title>{{ editing ? '✏️ Modifier' : '➕ Ajouter' }} un Profil</mat-card-title>
    <mat-card-content style="padding-top:20px">
      <mat-form-field appearance="outline" style="max-width:500px;width:100%">
        <mat-label>Libellé *</mat-label>
        <input matInput [(ngModel)]="current.libelle" required placeholder="ex: Informaticien (Bac+5)">
        <mat-icon matSuffix>badge</mat-icon>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions style="padding:16px;gap:8px">
      <button mat-raised-button color="primary" (click)="save()"><mat-icon>save</mat-icon> Enregistrer</button>
      <button mat-button (click)="cancel()"><mat-icon>close</mat-icon> Annuler</button>
    </mat-card-actions>
  </mat-card>

  <mat-card>
    <mat-card-content style="padding:0">
      <table mat-table [dataSource]="items">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let r" style="color:#556677">{{r.id}}</td>
        </ng-container>
        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef>Libellé</th>
          <td mat-cell *matCellDef="let r">
            <span style="background:rgba(0,230,118,.1);color:#00e676;padding:4px 12px;border-radius:12px;font-size:.85rem;font-weight:500">
              {{r.libelle}}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button color="primary" (click)="openForm(r)" matTooltip="Modifier"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(r.id)" matTooltip="Supprimer"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
      </table>
      <div *ngIf="items.length===0" class="empty-state">
        <mat-icon>badge</mat-icon><p>Aucun profil trouvé</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
